[package]
name = "rttsh-mcp"
version.workspace = true
edition.workspace = true

# The lib name becomes the cdylib file name (rttsh_mcp_native.dll) — keep it in sync
# with the C# side (McpNative.Library) and the BuildRttshNative MSBuild target.
[lib]
name = "rttsh_mcp_native"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# MCP protocol layer: official rust-sdk, same version as the embedded-debugger-mcp reference
rmcp = { version = "0.3.2", features = ["server", "macros", "transport-io"] }
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.0", features = ["derive"] }
